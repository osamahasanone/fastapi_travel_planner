[project]
name = "fastapi_travel_planner"
version = "0.1.0"
description = "Travel Planner"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "I",     # isort
    "A",     # flake8-builtins
    "RUF",   # Ruff-specific rules
    "PL",    # Pylint
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
